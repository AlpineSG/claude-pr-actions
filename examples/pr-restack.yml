# Copy to .github/workflows/pr-restack.yml in your repo.
name: PR Restack — retarget stacked PRs on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-restack-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  restack:
    uses: AlpineSG/claude-pr-actions/.github/workflows/pr-restack.yml@v1
    with:
      # The branch that carries claude-comment-addressing.yml (with its
      # workflow_dispatch trigger). Conflict sweeps are dispatched against it.
      dispatch-ref: main
    secrets: inherit
