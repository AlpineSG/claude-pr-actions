# Copy to .github/workflows/claude-comment-addressing.yml in your repo.
name: Claude — Address PR Comments

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  # Sweep mode: work through a PR's unresolved review threads (and fix
  # mergeability) without a new comment event. pr-restack dispatches this
  # after a rebase conflict or when threads survive a retarget. You can also
  # run it by hand from the Actions tab as a "sweep this PR" button.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to sweep for unresolved review threads
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  # packages: read   # only if you install from GitHub Packages

# Bot comment noise (review-bot inline comments, the App's own comments)
# goes to a separate concurrency group. Those runs always skip, but in a
# shared group their arrival would cancel the run doing the work: workflow-
# level concurrency cancels BEFORE job `if`s are evaluated. Review-bot review
# submissions do real work, so they stay in the work group.
concurrency:
  group: claude-comments-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}-${{ (github.event.sender.type == 'Bot' && github.event_name != 'pull_request_review') && 'bot-noise' || 'work' }}
  cancel-in-progress: true

jobs:
  address:
    uses: AlpineSG/claude-pr-actions/.github/workflows/claude-comment-addressing.yml@v1
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      # package-manager: npm
      # verify-commands: 'npm run lint,npm run typecheck,npm test'
      # review-bot-login: ''   # turn off review-bot-triggered runs
    secrets: inherit
